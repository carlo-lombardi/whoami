<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Graph image source</title>
<style>
  html, body { margin: 0; background: #070809; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="og" width="1200" height="630"></canvas>
<script type="module">
// Source of site/og.png: open this file in headless Chrome at 1200x630 and screenshot it
// (the exact command is in the README).
const W = 1200;
const H = 630;
const LINE = '214,220,228';
const AMBER = '251,191,36';
const SANS = 'system-ui, "Segoe UI", Roboto, Arial, sans-serif';
const MONO = 'ui-monospace, "Cascadia Code", Consolas, monospace';

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const ctx = document.getElementById('og').getContext('2d');
const rng = mulberry32(2026);

const bg = ctx.createLinearGradient(0, 0, 0, H);
bg.addColorStop(0, '#070809');
bg.addColorStop(1, '#14161a');
ctx.fillStyle = bg;
ctx.fillRect(0, 0, W, H);

[{ base: 0.7, amp: 0.09, alpha: 0.22 }, { base: 0.8, amp: 0.08, alpha: 0.38 }, { base: 0.9, amp: 0.06, alpha: 0.6 }].forEach((spec) => {
  const phases = [rng() * 6.28, rng() * 6.28, rng() * 6.28];
  const rows = [];
  for (let r = 0; r < 3; r++) {
    const row = [];
    for (let c = 0; c < 24; c++) {
      const x = (c - 0.5) * 56 + (rng() - 0.5) * 28;
      const u = x / W;
      const ridge = Math.sin(u * 5.1 + phases[0]) * 0.55 + Math.sin(u * 11.3 + phases[1]) * 0.3 + Math.sin(u * 23.7 + phases[2]) * 0.15;
      row.push({ x, y: H * (spec.base - spec.amp * (ridge + 0.4)) + r * 36 + (r ? (rng() - 0.5) * 14 : 0), hot: rng() < 0.06 });
    }
    rows.push(row);
  }
  ctx.fillStyle = '#0a0b0d';
  ctx.beginPath();
  ctx.moveTo(rows[0][0].x, H);
  rows[0].forEach((p) => ctx.lineTo(p.x, p.y));
  ctx.lineTo(W + 60, H);
  ctx.fill();

  ctx.strokeStyle = `rgba(${LINE},${spec.alpha * 0.5})`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  rows.forEach((row, r) => row.forEach((p, c) => {
    const below = rows[r + 1];
    if (row[c + 1]) { ctx.moveTo(p.x, p.y); ctx.lineTo(row[c + 1].x, row[c + 1].y); }
    if (below) {
      ctx.moveTo(p.x, p.y); ctx.lineTo(below[c].x, below[c].y);
      if (below[c + 1]) { ctx.moveTo(p.x, p.y); ctx.lineTo(below[c + 1].x, below[c + 1].y); }
    } else { ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, H); }
  }));
  ctx.stroke();
  rows.forEach((row) => row.forEach((p) => {
    ctx.fillStyle = p.hot ? `rgba(${AMBER},0.95)` : `rgba(${LINE},${spec.alpha + 0.2})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.hot ? 3 : 1.8, 0, Math.PI * 2);
    ctx.fill();
  }));
});

const x = 80;
ctx.textBaseline = 'alphabetic';
ctx.font = `600 26px ${MONO}`;
ctx.fillStyle = '#d4d4d8';
ctx.fillText('carlo@dublin:~', x, 120);
const w1 = ctx.measureText('carlo@dublin:~').width;
ctx.fillStyle = `rgb(${AMBER})`;
ctx.fillText('$', x + w1, 120);
ctx.fillStyle = '#f5f5f4';
ctx.fillText(' whoami', x + w1 + ctx.measureText('$').width, 120);

ctx.font = `700 92px ${SANS}`;
ctx.fillStyle = '#f5f5f4';
ctx.fillText('Carlo Lombardi', x - 4, 230);

ctx.font = `700 40px ${SANS}`;
let cx = x;
['Cloud', 'Identity', 'Automation'].forEach((word, i) => {
  if (i) {
    ctx.fillStyle = `rgb(${AMBER})`;
    ctx.fillText('·', cx + 14, 300);
    cx += 44;
  }
  ctx.fillStyle = '#f5f5f4';
  ctx.fillText(word, cx, 300);
  cx += ctx.measureText(word).width;
});

ctx.font = `400 27px ${SANS}`;
ctx.fillStyle = '#8b9099';
ctx.fillText('I keep systems running, then automate the parts', x, 366);
ctx.fillText("that shouldn't need a human.", x, 402);
</script>
</body>
</html>
